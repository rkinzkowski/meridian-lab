name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  python-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      ENABLE_IOS_DEVICE_TESTS: "0"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: 3.13.15
      - name: Install reviewed Windows runtime dependency lock
        run: python -m pip install --require-hashes -r python-runtime/requirements.lock
      - name: Install source test tools
        run: python -m pip install setuptools==84.0.0 pytest==8.4.2 pytest-asyncio==1.2.0
      - name: Install original adapter without resolving dependencies again
        run: python -m pip install --no-deps --no-build-isolation -e python-runtime
      - run: python -m pytest -p pytest_asyncio.plugin python-runtime/tests -q

  rust-core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      ENABLE_IOS_DEVICE_TESTS: "0"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install selected Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Test native libraries without a connected device or desktop bundle
        run: cargo +1.98.1 test --locked --release --workspace --exclude meridian-desktop

  ios-simulator:
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Validate unsigned iOS simulator build and XCTest runner
        env:
          IOS_SIMULATOR_DESTINATION: platform=iOS Simulator,name=iPhone 15
        run: bash apps/ios/build.sh simulator-test
