[package]
name = "meridian-mobile-core"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
idevice = { version = "=0.1.65", default-features = false, features = ["ring", "core_device_proxy", "remote_pairing", "tunnel_tcp_stack", "tcp", "rsd", "dvt", "location_simulation"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1.8"
base64 = "0.22"
ed25519-dalek = "2"
zeroize = "1"
meridian-route-engine.workspace = true
meridian-shared-types.workspace = true
