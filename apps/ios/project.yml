name: MeridianLab
options:
  bundleIdPrefix: dev.meridianlab
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
targets:
  MeridianLab:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
    entitlements:
      path: Generated/MeridianLab.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.meridianlab.ios
        SWIFT_OBJC_BRIDGING_HEADER: Sources/MeridianBridge.h
        LIBRARY_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/../../target/$(MERIDIAN_RUST_TARGET)/release"
        OTHER_LDFLAGS: "$(inherited) -lmeridian_mobile_core -lresolv -lc++"
        "MERIDIAN_RUST_TARGET[sdk=iphoneos*]": aarch64-apple-ios
        "MERIDIAN_RUST_TARGET[sdk=iphonesimulator*][arch=arm64]": aarch64-apple-ios-sim
        "MERIDIAN_RUST_TARGET[sdk=iphonesimulator*][arch=x86_64]": x86_64-apple-ios
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Meridian Lab
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        NSLocalNetworkUsageDescription: Meridian Lab connects to your paired development iPhone on a local developer network to simulate locations for testing.
        NSBonjourServices: ["_remotepairing._tcp"]
        CFBundleURLTypes:
          - CFBundleURLName: dev.meridianlab.connection
            CFBundleURLSchemes: [meridianlab]
        LSApplicationQueriesSchemes: [meridianbridge]
    dependencies:
      - target: MeridianLocalTunnel
        embed: true
      - sdk: MapKit.framework
      - sdk: NetworkExtension.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
  MeridianLocalTunnel:
    type: app-extension
    platform: iOS
    sources:
      - ../ios-bridge/Extension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.meridianlab.ios.local-tunnel
        SWIFT_OBJC_BRIDGING_HEADER: Sources/MeridianBridge.h
        LIBRARY_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/../../target/$(MERIDIAN_RUST_TARGET)/release"
        OTHER_LDFLAGS: "$(inherited) -lmeridian_mobile_core -lresolv -lc++"
        APPLICATION_EXTENSION_API_ONLY: YES
        "MERIDIAN_RUST_TARGET[sdk=iphoneos*]": aarch64-apple-ios
        "MERIDIAN_RUST_TARGET[sdk=iphonesimulator*][arch=arm64]": aarch64-apple-ios-sim
        "MERIDIAN_RUST_TARGET[sdk=iphonesimulator*][arch=x86_64]": x86_64-apple-ios
    entitlements:
      path: Generated/LocalTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    info:
      path: Generated/LocalTunnel-Info.plist
      properties:
        CFBundleDisplayName: Meridian Local Connection
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PacketTunnelProvider"
    dependencies:
      - sdk: NetworkExtension.framework
  MeridianBridge:
    type: application
    platform: iOS
    sources:
      - ../ios-bridge/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.meridianlab.bridge
    info:
      path: Generated/Bridge-Info.plist
      properties:
        CFBundleDisplayName: Meridian Bridge
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Meridian Bridge inspects developer pairing advertisements on your local network.
        NSBonjourServices: ["_remotepairing._tcp"]
        CFBundleURLTypes:
          - CFBundleURLName: dev.meridianlab.bridge
            CFBundleURLSchemes: [meridianbridge]
  MeridianLabTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: MeridianLab
schemes:
  MeridianLab:
    build:
      targets:
        MeridianLab: all
    test:
      targets: [MeridianLabTests]
  MeridianBridge:
    build:
      targets:
        MeridianBridge: all
