[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-location-runtime"
version = "0.1.0"
description = "Persistent developer location service for Meridian Lab"
requires-python = ">=3.13"
dependencies = ["pymobiledevice3==11.9.1"]

[project.scripts]
meridian-runtime = "location_runtime.__main__:main"

[tool.setuptools.packages.find]
include = ["location_runtime*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]
