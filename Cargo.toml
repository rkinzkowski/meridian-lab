[workspace]
resolver = "2"
members = ["crates/shared-types", "crates/ipc-types", "crates/route-engine", "crates/device-core", "crates/mobile-core", "crates/ios-bootstrap", "apps/desktop/src-tauri"]
default-members = ["crates/shared-types", "crates/ipc-types", "crates/route-engine", "crates/device-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
async-trait = "0.1"
meridian-shared-types = { path = "crates/shared-types" }
meridian-ipc-types = { path = "crates/ipc-types" }
meridian-route-engine = { path = "crates/route-engine" }
meridian-device-core = { path = "crates/device-core" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
